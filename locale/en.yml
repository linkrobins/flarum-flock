linkrobins-flock:
  admin:
    key_label: Flock key
    key_help: >
      Paste the key from your linkrobins.com dashboard. It unlocks selling
      memberships on this forum. Members you already have are never affected by
      it, including if it lapses.

    stripe_key_label: Stripe restricted key
    stripe_key_help: >
      From your own Stripe dashboard, under Developers, API keys, Create
      restricted key. Never paste your secret key here. Your members pay you
      directly and the money never passes through Link Robins.

    grace_days_label: Days to keep access after a failed payment
    grace_days_help: >
      Stripe retries a failed renewal for a few days. This is how long a member
      keeps their group while that happens, before it is taken back.

    active: >
      ✓ Connected. You can sell memberships on this forum.
    active_bound: >
      ✓ Connected, and this key belongs to {forum}.

    unconfigured: >
      Paste your Flock key to start selling memberships. Everything else on this
      page can be set up first.

    incomplete: >
      Your Flock subscription hasn't finished setting up yet. That usually takes
      a moment after paying. Press Check again.

    invalid_key: >
      That key wasn't recognized. Check you copied it in full, and that your
      Flock subscription is still active.

    canceled: >
      Your Flock subscription has lapsed, so no new memberships can be sold.
      Everyone who already pays you keeps their access, and their payments to
      you carry on as normal.

    bound_elsewhere: >
      This key is already in use on {forum}. A key belongs to one forum. Get
      another from your dashboard, or move this one there first.

    unreachable: >
      Can't reach Link Robins right now. Nothing is broken for your members, and
      you can keep selling until {date}.

    unreachable_expired: >
      Can't reach Link Robins, and it's been long enough that new memberships
      are paused. Everyone who already pays you keeps their access.

    check_again: Check again

  forum:
    plan_not_on_sale: That membership isn't available right now.
    not_selling: This forum isn't taking new memberships at the moment. Nothing changes for anyone who already has one.
    checkout_failed: Couldn't reach the payment page. Nothing has been charged. Try again in a moment.

# Refusals a member can act on. Flarum renders the type through these keys, so
# the key name is the error type with _message after it.
flock_plan_not_on_sale_message: That membership isn't available right now.
flock_not_selling_message: This forum isn't taking new memberships at the moment. Nothing changes for anyone who already has one.
flock_checkout_failed_message: Couldn't reach the payment page. Nothing has been charged. Try again in a moment.
